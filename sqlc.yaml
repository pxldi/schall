version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "internal/migrations"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        # Tables only the handwritten repositories touch (inbox_cleanups,
        # inbox_cleanup_files) get no generated model, so their hand-declared
        # structs cannot collide with a regenerated models.go.
        omit_unused_structs: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
