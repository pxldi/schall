# The tokens web/src/styles.css defines, by group. web/src/lib/design-system.test.ts
# fails when this file and the stylesheet disagree. The rules for using them are in
# the owner's design spec, which lives outside this repo.
name: Schall
description: A self-hosted music collection manager that shows its working and never guesses.
colors:
  inset: "#08060a"
  ground: "#0e0b10"
  surface-thin: "#1a1420"
  surface-regular: "#241a27"
  surface-thick: "#2d212f"
  surface-ultra: "#362838"
  line-thin: "#3d2f42"
  line-inset: "#17121b"
  line-regular: "#4a3a50"
  line-thick: "#5c4864"
  line-live: "#7a6280"
  shell-line: "#2c2233"
  accent: "#bfa3e8"
  accent-soft: "#d9c8f0"
  accent-ink: "#2a1c3d"
  ok: "#7fb387"
  ok-border: "#3d5647"
  idle: "#a59da7"
  decide: "#a3b7e8"
  busy: "#7dd3fc"
  fail: "#da8a7c"
  fail-border: "#5c3733"
  done: "#5eead4"
  ink: "#ece5ea"
  ink-2: "#bcb2b8"
  ink-3: "#aaa0aa"
  ink-4: "#9b919b"
  ink-muted-plum: "#a396a0"
typography:
  dense-micro:
    fontFamily: "Schibsted Grotesk, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "0.6875rem"
    fontWeight: 600
    lineHeight: 1.3
    letterSpacing: "0.1em"
  dense-meta:
    fontFamily: "Schibsted Grotesk, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "0.75rem"
    fontWeight: 400
    lineHeight: 1.35
    letterSpacing: "0"
  dense-body:
    fontFamily: "Schibsted Grotesk, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "0.8125rem"
    fontWeight: 400
    lineHeight: 1.45
    letterSpacing: "0"
  dense-lead:
    fontFamily: "Schibsted Grotesk, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "1.0625rem"
    fontWeight: 600
    lineHeight: 1.3
    letterSpacing: "-0.01em"
  dense-display:
    fontFamily: "Schibsted Grotesk, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "1.5rem"
    fontWeight: 700
    lineHeight: 1.1
    letterSpacing: "-0.02em"
  quiet-meta:
    fontFamily: "Schibsted Grotesk, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "0.8125rem"
    fontWeight: 400
    lineHeight: 1.6
    letterSpacing: "0"
  quiet-body:
    fontFamily: "Schibsted Grotesk, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "0.9375rem"
    fontWeight: 400
    lineHeight: 1.65
    letterSpacing: "0"
  quiet-lead:
    fontFamily: "Schibsted Grotesk, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "1.1875rem"
    fontWeight: 600
    lineHeight: 1.4
    letterSpacing: "-0.01em"
  quiet-display:
    fontFamily: "Schibsted Grotesk, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "1.625rem"
    fontWeight: 700
    lineHeight: 1.15
    letterSpacing: "-0.025em"
  data:
    fontFamily: "Azeret Mono, ui-monospace, SFMono-Regular, Menlo, monospace"
    fontSize: "0.9375em"
    fontWeight: 400
rounded:
  tight: "4px"
  row: "6px"
  control: "8px"
  panel: "12px"
  card: "16px"
spacing:
  row: "0.625rem"
  card: "1rem"
  page: "1.5rem"
components:
  button-primary:
    backgroundColor: "{colors.accent}"
    textColor: "{colors.accent-ink}"
    rounded: "{rounded.control}"
    padding: "0 0.75rem"
    height: "2rem"
    typography: "{typography.dense-body}"
  button-primary-hover:
    backgroundColor: "{colors.accent-soft}"
  button-outline:
    textColor: "{colors.ink}"
    rounded: "{rounded.control}"
    padding: "0 0.75rem"
    height: "2rem"
    typography: "{typography.dense-body}"
  button-danger:
    backgroundColor: "rgb(205 95 76 / 0.14)"
    textColor: "{colors.fail}"
    rounded: "{rounded.control}"
    padding: "0 0.75rem"
    height: "2rem"
    typography: "{typography.dense-body}"
  button-ghost:
    textColor: "{colors.ink-2}"
    rounded: "{rounded.control}"
    padding: "0 0.75rem"
    height: "2rem"
    typography: "{typography.dense-body}"
  field:
    backgroundColor: "{colors.inset}"
    textColor: "{colors.ink}"
    rounded: "{rounded.control}"
    padding: "0 0.625rem"
    height: "2.125rem"
    typography: "{typography.data}"
  nav-item:
    textColor: "{colors.ink-2}"
    padding: "0 0.125rem"
    typography: "{typography.dense-body}"
  nav-item-active:
    textColor: "{colors.ink}"
    borderColor: "{colors.accent}"
