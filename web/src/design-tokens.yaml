# The tokens web/src/styles.css defines, by group. web/src/lib/design-system.test.ts
# fails when this file and the stylesheet disagree. The rules for using them are in
# the owner's design spec, which lives outside this repo (ADR 0042).
name: Schall
description: A self-hosted music collection manager drawn as a monochrome studio console.
colors:
  ground: "#141414"
  panel: "#1b1b1b"
  raised: "#232323"
  inset: "#0e0e0e"
  rule: "#2c2c2c"
  rule-strong: "#3d3d3d"
  ink: "#ece9e2"
  ink-2: "#c2beb6"
  ink-3: "#9b978f"
  ink-4: "#8e8b84"
  ok: "#7fd49a"
  idle: "#9b978f"
  decide: "#f0c45a"
  busy: "#7fb8ff"
  fail: "#ff7b6b"
  done: "#5fd6c4"
colors-light:
  ground: "#e4e2dc"
  panel: "#eeece7"
  raised: "#f7f6f3"
  inset: "#ffffff"
  rule: "#cdc9c0"
  rule-strong: "#b2ada3"
  ink: "#161513"
  ink-2: "#3d3a35"
  ink-3: "#57534c"
  ink-4: "#68645c"
  ok: "#176636"
  idle: "#57534c"
  decide: "#775300"
  busy: "#1a55b0"
  fail: "#a83224"
  done: "#0b6459"
typography:
  micro:
    fontFamily: "Martian Mono, ui-monospace, monospace"
    fontSize: "0.6875rem"
    fontWeight: 400
    lineHeight: 1.3
    letterSpacing: "0.06em"
  meta:
    fontFamily: "Barlow, 'Segoe UI', system-ui, sans-serif"
    fontSize: "0.78125rem"
    fontWeight: 400
    lineHeight: 1.4
    letterSpacing: "0"
  body:
    fontFamily: "Barlow, 'Segoe UI', system-ui, sans-serif"
    fontSize: "0.875rem"
    fontWeight: 400
    lineHeight: 1.45
    letterSpacing: "0"
  lead:
    fontFamily: "Barlow, 'Segoe UI', system-ui, sans-serif"
    fontSize: "1rem"
    fontWeight: 600
    lineHeight: 1.35
    letterSpacing: "0"
  title:
    fontFamily: "Barlow, 'Segoe UI', system-ui, sans-serif"
    fontSize: "1.875rem"
    fontWeight: 600
    lineHeight: 1.1
    letterSpacing: "-0.01em"
rounded:
  none: "0px"
  cover: "2px"
spacing:
  strip: "2.5rem"
  row: "2.25rem"
  key-strip: "2rem"
  inspector: "21.25rem"
  gutter: "1.25rem"
components:
  button-default:
    backgroundColor: "{colors.raised}"
    textColor: "{colors.ink}"
    rounded: "{rounded.none}"
    padding: "0 0.75rem"
    height: "1.875rem"
    typography: "{typography.body}"
  button-primary:
    backgroundColor: "{colors.ink}"
    textColor: "{colors.ground}"
    rounded: "{rounded.none}"
    padding: "0 0.75rem"
    height: "1.875rem"
    typography: "{typography.body}"
  button-danger:
    backgroundColor: "{colors.raised}"
    textColor: "{colors.fail}"
    rounded: "{rounded.none}"
    padding: "0 0.75rem"
    height: "1.875rem"
    typography: "{typography.body}"
  button-ghost:
    textColor: "{colors.ink-2}"
    rounded: "{rounded.none}"
    padding: "0 0.75rem"
    height: "1.875rem"
    typography: "{typography.body}"
  keycap:
    textColor: "{colors.ink-3}"
    rounded: "{rounded.none}"
    padding: "0 0.25rem"
    height: "1.125rem"
    typography: "{typography.micro}"
  field:
    backgroundColor: "{colors.inset}"
    textColor: "{colors.ink}"
    rounded: "{rounded.none}"
    padding: "0 0.625rem"
    height: "2rem"
    typography: "{typography.body}"
  row:
    textColor: "{colors.ink}"
    height: "2.25rem"
    typography: "{typography.body}"
  row-cursor:
    backgroundColor: "{colors.ink}"
    textColor: "{colors.ground}"
  tab:
    textColor: "{colors.ink-3}"
    padding: "0 0.875rem"
    typography: "{typography.body}"
  tab-current:
    backgroundColor: "{colors.ink}"
    textColor: "{colors.ground}"
  cover:
    rounded: "{rounded.cover}"
