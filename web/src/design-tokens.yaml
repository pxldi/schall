# The tokens web/src/styles.css defines, by group. web/src/lib/design-system.test.ts
# fails when this file and the stylesheet disagree. The rules for using them are in
# the owner's design spec, which lives outside this repo.
name: Schall
description: A self-hosted music collection manager that shows its working and never guesses.
colors:
  duo-dark: "#13204a"
  duo-light: "#ffb59e"
  inset: "#090a0d"
  ground: "#0d0f12"
  surface-thin: "#14171c"
  surface-regular: "#1b1f25"
  surface-thick: "#22262c"
  surface-ultra: "#2a2f36"
  line-thin: "#22262c"
  line-inset: "#121418"
  line-regular: "#2d3239"
  line-thick: "#3a4048"
  line-live: "#4f5660"
  shell-line: "#22262c"
  ok: "#9be0b0"
  ok-border: "#36513f"
  idle: "#a5aab2"
  decide: "#f2c66d"
  busy: "#8ec5ff"
  fail: "#f08a7a"
  fail-border: "#5c3530"
  done: "#5eead4"
  ink: "#eef0f2"
  ink-2: "#c6cad0"
  ink-3: "#a5aab2"
  ink-4: "#8a9099"
typography:
  dense-micro:
    fontFamily: "Bricolage Grotesque, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "0.6875rem"
    fontWeight: 600
    lineHeight: 1.3
    letterSpacing: "0.1em"
  dense-meta:
    fontFamily: "Bricolage Grotesque, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "0.75rem"
    fontWeight: 400
    lineHeight: 1.35
    letterSpacing: "0"
  dense-body:
    fontFamily: "Bricolage Grotesque, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "0.8125rem"
    fontWeight: 400
    lineHeight: 1.45
    letterSpacing: "0"
  dense-lead:
    fontFamily: "Bricolage Grotesque, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "1.0625rem"
    fontWeight: 600
    lineHeight: 1.3
    letterSpacing: "-0.01em"
  dense-display:
    fontFamily: "Bricolage Grotesque, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "1.5rem"
    fontWeight: 700
    lineHeight: 1.1
    letterSpacing: "-0.02em"
  quiet-meta:
    fontFamily: "Bricolage Grotesque, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "0.8125rem"
    fontWeight: 400
    lineHeight: 1.6
    letterSpacing: "0"
  quiet-body:
    fontFamily: "Bricolage Grotesque, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "0.9375rem"
    fontWeight: 400
    lineHeight: 1.65
    letterSpacing: "0"
  quiet-lead:
    fontFamily: "Bricolage Grotesque, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "1.1875rem"
    fontWeight: 600
    lineHeight: 1.4
    letterSpacing: "-0.01em"
  quiet-display:
    fontFamily: "Bricolage Grotesque, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "1.625rem"
    fontWeight: 700
    lineHeight: 1.15
    letterSpacing: "-0.025em"
  poster-m:
    fontFamily: "Bricolage Grotesque, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "4rem"
    fontWeight: 800
    lineHeight: 0.86
    letterSpacing: "-0.05em"
  poster-l:
    fontFamily: "Bricolage Grotesque, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "5.25rem"
    fontWeight: 800
    lineHeight: 0.84
    letterSpacing: "-0.055em"
  poster-xl:
    fontFamily: "Bricolage Grotesque, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "clamp(4.5rem, 8.25vw, 7.5rem)"
    fontWeight: 800
    lineHeight: 0.82
    letterSpacing: "-0.055em"
  data:
    fontFamily: "Bricolage Grotesque, 'Avenir Next', 'Segoe UI', sans-serif"
    fontSize: "0.9375em"
    fontWeight: 400
rounded:
  tight: "4px"
  row: "6px"
  control: "8px"
  panel: "12px"
  card: "16px"
  pill: "999px"
spacing:
  row: "0.625rem"
  card: "1rem"
  page: "1.5rem"
components:
  button-primary:
    backgroundColor: "{colors.duo-light}"
    textColor: "{colors.duo-dark}"
    rounded: "{rounded.pill}"
    padding: "0 0.75rem"
    height: "2rem"
    typography: "{typography.dense-body}"
  button-primary-hover:
    backgroundColor: "color-mix(in srgb, {colors.duo-light} 85%, white)"
  button-outline:
    textColor: "{colors.ink}"
    rounded: "{rounded.pill}"
    padding: "0 0.75rem"
    height: "2rem"
    typography: "{typography.dense-body}"
  button-danger:
    backgroundColor: "rgb(205 95 76 / 0.14)"
    textColor: "{colors.fail}"
    rounded: "{rounded.pill}"
    padding: "0 0.75rem"
    height: "2rem"
    typography: "{typography.dense-body}"
  button-ghost:
    textColor: "{colors.ink-2}"
    rounded: "{rounded.pill}"
    padding: "0 0.75rem"
    height: "2rem"
    typography: "{typography.dense-body}"
  field:
    backgroundColor: "{colors.inset}"
    textColor: "{colors.ink}"
    rounded: "{rounded.control}"
    padding: "0 0.625rem"
    height: "2.125rem"
    typography: "{typography.data}"
  nav-item:
    textColor: "{colors.ink-2}"
    padding: "0 0.125rem"
    typography: "{typography.dense-body}"
  nav-item-active:
    backgroundColor: "{colors.duo-dark}"
    textColor: "{colors.duo-light}"
