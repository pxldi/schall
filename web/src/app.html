<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` lets the page draw under the rounded corners and the
         home indicator of a phone that has them. It is what makes the
         `env(safe-area-inset-*)` values readable at all: without it they are
         always zero, and the padding written against them does nothing. The
         insets are then added back where something would otherwise sit under the
         hardware — the top of the mobile header, the bottom of the drawer and of
         the review answer bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0b10" />
    <!-- The mark the app already wears, at the one size nothing controls. It is
         drawn on transparency, so a browser puts it on its own tab colour and it
         reads in a light chrome and a dark one alike. -->
    <link rel="icon" href="%sveltekit.assets%/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/logo.svg" />
    <!-- The three faces the first screen draws, asked for here rather than left
         to be found later. A browser does not know a font exists until it has
         downloaded the stylesheet, read it, and met text that needs the font —
         three steps in a row, each waiting on the one before. That is the half
         second in which the page is drawn in whatever face the operating system
         supplies, and the reason it jumps when the real face arrives. Naming the
         files here starts them downloading beside the stylesheet instead of
         after it.

         `crossorigin` is required even though the files are served from this
         same server. A font is always fetched anonymously, so a preload without
         it is treated as a different request, and the browser downloads every
         file twice. -->
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/schibsted-grotesk-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/azeret-mono-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/syne-latin-800.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="description"
      content="Schall keeps your self-hosted music collection complete."
    />
    <!-- The ground colour is inlined so a cold load paints it before the
         bundle arrives. There is no splash: the owner found the breathing
         wordmark worse than a plain ground (2026-09-08). -->
    <style>
      html {
        background: #0e0b10;
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
