<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` makes the `env(safe-area-inset-*)` values
         readable on a phone with rounded corners. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e4e2dc" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="%sveltekit.assets%/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/logo.svg" />
    <!-- The faces the first screen draws, asked for beside the stylesheet
         instead of after it has been read. `crossorigin` is required even on
         this server: a font is fetched anonymously, and a preload without it
         is downloaded twice. -->
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/barlow-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/barlow-latin-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/martian-mono-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="description"
      content="Schall keeps your self-hosted music collection complete."
    />
    <!-- The theme is set before the first paint, so a light reader never sees
         the dark ground flash (lib/theme.svelte.ts keeps it after that). -->
    <script>
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem('schall:appearance');
        } catch (error) {}
        if (choice !== 'light' && choice !== 'dark') {
          choice = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = choice;
      })();
    </script>
    <style>
      html {
        background: #141414;
      }
      html[data-theme='light'] {
        background: #e4e2dc;
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
